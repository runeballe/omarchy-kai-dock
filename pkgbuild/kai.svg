<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2d3a"/>
      <stop offset="1" stop-color="#14151c"/>
    </linearGradient>
    <linearGradient id="shelf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe45c"/>
      <stop offset="1" stop-color="#ffb800"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fd1ff"/>
      <stop offset="1" stop-color="#3a8be0"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8f8f"/>
      <stop offset="1" stop-color="#e0456b"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="4.75" y="4.75" width="118.500" height="118.500" rx="27.25" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.5"/>
  <!-- the shelf: a plane receding from the front edge -->
  <path d="M16 98 H112 L100 78 H28 Z" fill="url(#shelf)"/>
  <rect x="16" y="98" width="96" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.55"/>
  <!-- three icons, the middle one magnified -->
  <rect x="24" y="58" width="24" height="24" rx="7" fill="url(#left)"/>
  <rect x="45" y="36" width="38" height="46" rx="11" fill="url(#mid)"/>
  <rect x="80" y="58" width="24" height="24" rx="7" fill="url(#right)"/>
  <!-- running dots -->
  <circle cx="36" cy="90" r="2.4" fill="#ffffff" fill-opacity="0.85"/>
  <circle cx="64" cy="90" r="2.8" fill="#ffd60a"/>
</svg>
